<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-label="UPI Reliability Intelligence: Which banks fail most, and which fail the most people.">
<defs>
  <style>
    .serif { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; }
    .sans  { font-family: 'Inter Tight', 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; }
    .mono  { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; }
    .blink { animation: blink 1.6s ease-in-out infinite; }
    .pulse { animation: pulse 6s ease-in-out infinite; }
        @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
    @keyframes pulse { 0%,35% { opacity: .0 } 50%,85% { opacity: 1 } 100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .05 0"/>
  </filter></defs>
