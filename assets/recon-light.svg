<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-label="Merchant Settlement Reconciliation: Did every rupee we sold actually reach the bank?">
<defs>
  <style>
    .serif { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; }
    .sans  { font-family: 'Inter Tight', 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; }
    .mono  { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; }
    .blink { animation: blink 1.6s ease-in-out infinite; }
    .pulse { animation: pulse 6s ease-in-out infinite; }
        @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
    @keyframes pulse { 0%,35% { opacity: .0 } 50%,85% { opacity: 1 } 100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .05 0"/>
  </filter></defs>
<rect x="1" y="1" width="1198" height="288" rx="16" fill="#fbfaf6" stroke="#e0dbcc"/>
<line x1="760" x2="760" y1="36" y2="254" stroke="#e0dbcc"/>
<text class="mono" x="48" y="62" font-size="12.5" letter-spacing="2" fill="#a3a097">02  <tspan fill="#6d6b64">/ github.com/Amaann190/merchant-settlement-reconciliation</tspan></text>
<g class="rise"><text class="serif" x="46" y="128" font-size="42" fill="#141413" letter-spacing="-.5">Merchant Settlement Reconciliation</text></g>
<g class="rise" style="animation-delay:.15s"><text class="serif" x="48" y="166" font-size="23" font-style="italic" fill="#6d6b64">Did every rupee we sold actually reach the bank?</text></g>
<text class="sans" x="48" y="212" font-size="14.5" fill="#a3a097">books → gateway → bank · 10,000/10,000 orders verified to the paisa</text>
<text class="mono" x="48" y="252" font-size="11.5" letter-spacing="1.6" fill="#6d6b64">PYTHON · SQLITE · POWER BI · PYTEST</text>
<text class="serif" x="1152" y="118" font-size="78" text-anchor="end" fill="#141413" letter-spacing="-1">₹25.4L</text>
<text class="mono" x="1152" y="146" font-size="11" letter-spacing="1.6" text-anchor="end" fill="#6d6b64">RECOVERABLE GAPS TRACED</text>
