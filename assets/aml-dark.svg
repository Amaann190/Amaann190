<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-label="AML Graph Intelligence: Following money between accounts, not just counting transfers.">
<defs>
  <style>
    .serif { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; }
    .sans  { font-family: 'Inter Tight', 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; }
    .mono  { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; }
    .blink { animation: blink 1.6s ease-in-out infinite; }
    .pulse { animation: pulse 6s ease-in-out infinite; }
        @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
    @keyframes pulse { 0%,35% { opacity: .0 } 50%,85% { opacity: 1 } 100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .07 0"/>
  </filter></defs>
<rect x="1" y="1" width="1198" height="288" rx="16" fill="#101010" stroke="#232322"/>
<line x1="760" x2="760" y1="36" y2="254" stroke="#232322"/>
<text class="mono" x="48" y="62" font-size="12.5" letter-spacing="2" fill="#5a5955">01  <tspan fill="#8b8a84">/ github.com/Amaann190/aml-graph-intelligence</tspan></text>
<g class="rise"><text class="serif" x="46" y="128" font-size="42" fill="#f4f3ee" letter-spacing="-.5">AML Graph Intelligence</text></g>
<g class="rise" style="animation-delay:.15s"><text class="serif" x="48" y="166" font-size="23" font-style="italic" fill="#8b8a84">Following money between accounts, not just counting transfers.</text></g>
<text class="sans" x="48" y="212" font-size="14.5" fill="#5a5955">5.08M synthetic transfers · 42.3% precision vs 0.17% for daily rules</text>
<text class="mono" x="48" y="252" font-size="11.5" letter-spacing="1.6" fill="#8b8a84">PYTHON · NETWORKX · PANDAS · POWER BI · PYTEST</text>
<text class="serif" x="1152" y="118" font-size="78" text-anchor="end" fill="#f4f3ee" letter-spacing="-1">415×</text>
<text class="mono" x="1152" y="146" font-size="11" letter-spacing="1.6" text-anchor="end" fill="#8b8a84">PRECISION LIFT OVER BASE RATE</text>
<path d="M 900 186 L 952 206 L 1004 186 L 1056 206 L 1108 186" fill="none" stroke="#5a5955" stroke-width="1.3"/><path d="M 1108 186 Q 1004.0 248 900 186" fill="none" stroke="#ff6a3d" stroke-width="1.4" stroke-dasharray="4 4"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite"/></path><circle cx="900" cy="186" r="4.5" fill="#101010" stroke="#f4f3ee" stroke-width="1.3"/><circle cx="952" cy="206" r="4.5" fill="#101010" stroke="#f4f3ee" stroke-width="1.3"/><circle cx="1004" cy="186" r="4.5" fill="#101010" stroke="#f4f3ee" stroke-width="1.3"/><circle cx="1056" cy="206" r="4.5" fill="#101010" stroke="#f4f3ee" stroke-width="1.3"/><circle cx="1108" cy="186" r="4.5" fill="#101010" stroke="#f4f3ee" stroke-width="1.3"/><circle r="3" fill="#ff6a3d"><animateMotion dur="4s" repeatCount="indefinite" path="M 900 186 L 952 206 L 1004 186 L 1056 206 L 1108 186 Q 1004.0 248 900 186"/></circle>
<rect width="1200" height="290" rx="16" filter="url(#grain)" pointer-events="none"/>
</svg>